<title>DJSG Kota Main Demo</title>

<style>
:root{
--bg:#FFF4E8;--bg2:#FDE6EF;--bg3:#EFE6FF;--ink:#2A1530;--muted:#6C5470;--glass:rgba(255,255,255,.66);--line:rgba(255,255,255,.95);

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%)}

.b1{width:60vmax;height:60vmax;left:-25vmax;top:-25vmax;background:var(--a1)}
.b2{width:50vmax;height:50vmax;right:-22vmax;top:20vh;background:var(--a3);animation-delay:-7s}
.b3{width:40vmax;height:40vmax;left:20vw;bottom:-22vmax;background:var(--a2);animation-delay:-13s}

/* ONE SCREEN: the page is exactly the visible height */
.app{position:relative;z-index:1;height:100dvh;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);
 padding:max(6px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* header: switch | name | login  (mirror) */
.head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.head .l{justify-self:start}.head .r{justify-self:end}

.login:active,.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--btn-edge)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}

.names{display:flex;flex-direction:column;line-height:1;white-space:nowrap}

var angle=-25,drag=null,hov=false,open=false,last=null;

sc.addEventListener('pointerenter',function(){hov=true});sc.addEventListener('pointerleave',function(){hov=false});

var P=[[/^(\d+)th Punyatithi$/,'$1वीं पुण्यतिथि']];
var L='en';try{L=localStorage.getItem('djsg_lang')==='hi'?'hi':'en'}catch(_){}
var ORIG=new WeakMap(),AORIG=new WeakMap(),busy=false;
function tr(t){var k=t.trim();if(!k)return null;var h=D[k];if(h==null){for(var i=0;i<P.length;i++)if(P[i][0].test(k)){h=k.replace(P[i][0],P[i][1]);break}}if(h==null)return null;var m=t.match(/^(\s*)[\s\S]*?(\s*)$/);return m[1]+h+m[2]}
function skip(n){for(var e=n.parentNode;e&&e!==document.body;e=e.parentNode){if(e.nodeType===1&&(/^(SCRIPT|STYLE|TEXTAREA)$/.test(e.tagName)||e.hasAttribute('data-noi18n')||(e.classList&&e.classList.contains('lang'))))return true}return false}
function walk(root){if(!root)return;var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n,list=[];while(n=w.nextNode())list.push(n);
 list.forEach(function(n){if(skip(n))return;var cur=n.nodeValue;
  if(L==='hi'){if(ORIG.has(n)&&ORIG.get(n).hi===cur)return;var h=tr(cur);if(h!=null&&h!==cur){ORIG.set(n,{en:cur,hi:h});n.nodeValue=h}}
  else{var o=ORIG.get(n);if(o&&o.hi===cur){n.nodeValue=o.en}ORIG.delete(n)}});
 var els=root.querySelectorAll?root.querySelectorAll('[aria-label],[title],img[alt]'):[];
 Array.prototype.forEach.call(els,function(e){['aria-label','title','alt'].forEach(function(a){var v=e.getAttribute(a);if(!v)return;var key=a+'|';var store=AORIG.get(e)||{};
  if(L==='hi'){if(A[v]||D[v]){store[a]=v;AORIG.set(e,store);e.setAttribute(a,A[v]||D[v])}}else if(store[a]){e.setAttribute(a,store[a]);delete store[a]}})})}
function paintSw(){var sp=document.querySelectorAll('.lang span');if(sp.length>=2){sp[0].classList.toggle('on',L==='hi');sp[1].classList.toggle('on',L==='en');sp[0].setAttribute('role','button');sp[1].setAttribute('role','button');sp[0].setAttribute('aria-pressed',L==='hi');sp[1].setAttribute('aria-pressed',L==='en');sp[0].tabIndex=0;sp[1].tabIndex=0}}
function apply(){busy=true;document.documentElement.lang=L;walk(document.body);paintSw();busy=false}

new MutationObserver(function(ms){if(busy||L!=='hi')return;busy=true;ms.forEach(function(m){if(m.type==='characterData'){walk(m.target.parentNode)}else m.addedNodes.forEach(function(n){if(n.nodeType===1)walk(n);else if(n.nodeType===3&&n.parentNode)walk(n.parentNode)})});busy=false}).observe(document.body,{childList:true,subtree:true,characterData:true});
