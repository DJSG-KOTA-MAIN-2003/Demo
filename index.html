<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>DJSG Kota Main Demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
--bg:#FFF4E8;--bg2:#FDE6EF;--bg3:#EFE6FF;--ink:#2A1530;--muted:#6C5470;--glass:rgba(255,255,255,.66);--line:rgba(255,255,255,.95);
--a1:#A3123A;--a2:#FF9F1C;--a3:#8E6CEF;--btn:#A3123A;--btn-edge:#6E0B27;--btn-ink:#fff;--glow:rgba(163,18,58,.25);
--f1:linear-gradient(135deg,#A3123A,#E8590C);--f2:linear-gradient(135deg,#FF9F1C,#FF5E8A);--f3:linear-gradient(135deg,#8E6CEF,#C2185B);--f4:linear-gradient(135deg,#F4B400,#A3123A);--ftop:linear-gradient(135deg,#2A1530,#6E0B27);
--shadow:rgba(60,20,50,.18);
--gap:clamp(6px,1.1dvh,12px);
--cs:clamp(58px,9dvh,112px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38;animation:drift 20s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;left:-25vmax;top:-25vmax;background:var(--a1)}
.b2{width:50vmax;height:50vmax;right:-22vmax;top:20vh;background:var(--a3);animation-delay:-7s}
.b3{width:40vmax;height:40vmax;left:20vw;bottom:-22vmax;background:var(--a2);animation-delay:-13s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.1)}}

/* ONE SCREEN: the page is exactly the visible height */
.app{position:relative;z-index:1;height:100dvh;max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);
 padding:max(6px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.flag{flex:none;height:4px;border-radius:3px;background:linear-gradient(90deg,#D7263D 0 20%,#F4B400 20% 40%,#fff 40% 60%,#1E9E50 60% 80%,#1F4FBF 80%);box-shadow:0 1px 3px var(--shadow)}

/* header: switch | name | login  (mirror) */
.head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.head .l{justify-self:start}.head .r{justify-self:end}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);box-shadow:0 3px 8px var(--shadow);font-weight:700;font-size:11px}
.lang span{padding:5px 8px;border-radius:999px;color:var(--muted)}
.lang .on{background:var(--btn);color:#fff;box-shadow:0 2px 0 var(--btn-edge)}
.login{padding:8px 12px;border-radius:999px;background:var(--btn);color:#fff;font-weight:700;font-size:11px;box-shadow:0 3px 0 var(--btn-edge),0 6px 12px var(--glow);white-space:nowrap}
.login:active,.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--btn-edge)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{flex:none;width:clamp(40px,6.4dvh,58px);height:clamp(40px,6.4dvh,58px);border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 6px 14px var(--shadow),0 0 0 2px var(--glow)}
.names{display:flex;flex-direction:column;line-height:1;white-space:nowrap}
.dj{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(20px,3.2dvh,32px);letter-spacing:-.8px}
.km{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(17px,2.7dvh,26px);letter-spacing:-.6px;background:linear-gradient(120deg,var(--a1),var(--a2) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{flex:none;text-align:center;font-size:clamp(10px,1.45dvh,12.5px);color:var(--muted);line-height:1.25;margin-top:calc(var(--gap)*-.4)}
.sub b{color:var(--ink);font-weight:700}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--a1);font-weight:700;letter-spacing:.6px;font-size:.92em}

/* menu */
.nav{flex:none;display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 6px 16px var(--shadow);overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;padding:7px 11px;border-radius:999px;font-weight:600;font-size:12.5px;color:var(--muted)}
.nav button[aria-current]{background:var(--btn);color:#fff;box-shadow:0 3px 0 var(--btn-edge)}

/* one rotating info line (notice, date+tithi, next programme, birthdays, thought, numbers) */
.tick{flex:none;position:relative;display:flex;align-items:center;gap:8px;height:clamp(30px,4.3dvh,38px);padding:0 10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 4px 12px var(--shadow);overflow:hidden;width:100%;text-align:left}
.tick .ic{flex:none;font-size:15px}
.tick .tx{flex:1;min-width:0;font-size:clamp(11px,1.6dvh,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick .tx b{color:var(--a1)}
.tick .td{flex:none;display:flex;gap:3px}.tick .td i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.35}.tick .td i.on{opacity:1;background:var(--a1);width:12px;border-radius:3px}
.tick.memorial{background:var(--btn);color:#fff;border-color:transparent;box-shadow:0 4px 0 var(--btn-edge)}
.tick.memorial .tx b{color:#FFD58A}.tick.memorial .td{display:none}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* main symmetric stage */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap)}
.col{display:contents}
.centre{display:flex;flex-direction:column;align-items:center;gap:calc(var(--gap)*.7);order:0}
.welcome{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(15px,2.3dvh,22px);color:var(--a1);text-align:center;line-height:1.1}
.welcome small{display:inline;margin-left:4px;font-family:Inter;font-weight:500;font-size:clamp(10.5px,1.5dvh,13px);color:var(--muted)}
.cuberow{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.scene{width:var(--cs);height:var(--cs);position:relative;perspective:900px;margin:calc(var(--cs)*.12) calc(var(--cs)*.1) calc(var(--cs)*.2);touch-action:pan-y;cursor:grab}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-align:center;border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 0 30px rgba(255,255,255,.25);backface-visibility:hidden}
.face b{font-family:Sora,sans-serif;font-size:calc(var(--cs)*.13);text-shadow:0 2px 8px rgba(0,0,0,.3)}
.face span{font-size:calc(var(--cs)*.075);font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.22)}
.face .logo{width:46%;height:46%}
.floor{position:absolute;left:10%;right:10%;bottom:calc(var(--cs)*-.2);height:16px;border-radius:50%;background:radial-gradient(closest-side,var(--shadow),transparent)}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:clamp(48px,7dvh,66px);padding:8px 6px;border-radius:20px;background:var(--btn);color:#fff;font-weight:700;font-size:clamp(12px,1.75dvh,14px);line-height:1.15;text-align:center;box-shadow:0 5px 0 var(--btn-edge),0 10px 20px var(--glow);transition:transform .08s,box-shadow .08s}
.btn small{font-weight:500;font-size:.8em;opacity:.85}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:0 5px 0 rgba(163,18,58,.25),0 10px 20px var(--shadow)}
.btn .bi{font-size:1.25em}

/* cards */
.card{position:relative;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 10px 24px var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);overflow:hidden;text-align:left;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .15s,box-shadow .2s}
.card::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:var(--glow);filter:blur(20px);pointer-events:none}
.tag{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--a1)}

/* BIG office bearers: active bearer in the middle, others on both sides */
.bear{padding:calc(var(--gap)*.9) 12px;display:flex;flex-direction:column;align-items:center;gap:calc(var(--gap)*.5);width:100%}
.bear .tagrow{display:flex;justify-content:space-between;width:100%;align-items:center}
.bear .more{font-size:11px;font-weight:700;color:var(--a1)}
.trio{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,26px)}
.ph{flex:none;border-radius:50%;background:#ddd center/cover;border:3px solid #fff;box-shadow:0 8px 18px var(--shadow);transition:all .6s cubic-bezier(.3,1.3,.5,1)}
.trio .ph{width:clamp(38px,5.8dvh,54px);height:clamp(38px,5.8dvh,54px);opacity:.75;filter:saturate(.8)}
.trio .ph.mid{width:clamp(56px,9dvh,100px);height:clamp(56px,9dvh,100px);opacity:1;filter:none;box-shadow:0 10px 24px var(--shadow),0 0 0 3px var(--a1)}
.who{text-align:center;line-height:1.15}
.who b{display:block;font-family:Sora,sans-serif;font-size:clamp(14px,2.1dvh,18px)}
.who span{font-size:clamp(11px,1.6dvh,13px);color:var(--muted)}

/* slim strips: founder (left) / Insta (right) */
.strip{display:flex;align-items:center;gap:9px;width:100%;padding:5px 12px 5px 5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 5px 12px var(--shadow);text-align:left}
.strip .ph{width:clamp(30px,4.4dvh,40px);height:clamp(30px,4.4dvh,40px);border-width:2px}
.strip .pk{filter:grayscale(.35)}
.strip small{display:block;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.strip b{display:block;font-family:Sora,sans-serif;font-size:clamp(11.5px,1.65dvh,13.5px);line-height:1.15}
.strip .arr{margin-left:auto;color:var(--a1);font-weight:800}
.ig{background:linear-gradient(45deg,#F9A825,#E91E63,#8E24AA);display:flex;align-items:center;justify-content:center}
.ig svg,.ti svg,.dk svg{width:55%;height:55%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* section tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:calc(var(--gap)*.8) 4px;min-height:clamp(54px,8dvh,88px);text-align:center}
.ti{width:clamp(28px,4.4dvh,40px);height:clamp(28px,4.4dvh,40px);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 10px var(--shadow)}
.tile b{font-family:Sora,sans-serif;font-size:clamp(11.5px,1.65dvh,14px);line-height:1.1;overflow-wrap:anywhere}
.tile span{font-size:clamp(10px,1.4dvh,12px);color:var(--muted);line-height:1.1}
.tile .cnt{position:absolute;top:6px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--a2);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* gallery tile (computer only) */
.gal{padding:12px;display:flex;flex-direction:column;gap:8px;width:100%}
.mos{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;height:clamp(70px,11dvh,120px)}
.mos i{border-radius:10px;transition:background 1s}
.mos i:first-child{grid-row:span 2}

/* bottom dock: notices | photos | app | WhatsApp */
.dock{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:5px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 8px 20px var(--shadow)}
.dk{text-align:center;line-height:1.1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:14px;font-size:clamp(10px,1.4dvh,12px);font-weight:600;color:var(--muted)}
.dk i{width:clamp(26px,3.8dvh,34px);height:clamp(26px,3.8dvh,34px);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.foot{flex:none;display:flex;justify-content:center;align-items:center;gap:8px;font-size:10px;color:var(--muted);flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.dots{display:inline-flex;gap:4px}.dots button{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px var(--shadow)}

.phn .tile{min-height:clamp(48px,7.4dvh,80px);gap:2px;padding:6px 3px}
.phn .tile>span:last-of-type{display:none}
.phn .tile b{font-size:clamp(11px,1.6dvh,13.5px)}
.phn .chip{position:absolute;top:5px;right:6px;padding:1px 6px;border-radius:8px;background:var(--a2);color:#fff;font-size:9.5px;font-weight:800}
/* phone order: the bearers box takes all spare height, so it stays big */
.stage>*{flex:none}
.bearC{order:1}.founder{order:2}.tilesC{order:3}.insta{order:2}
.dsk{display:none!important}

/* computer: three symmetric columns */
@media (min-width:900px){
 .stage>*{flex:initial}
 :root{--cs:clamp(150px,24dvh,230px);--gap:clamp(8px,1.4dvh,14px)}
 .app{padding-inline:24px}
 .head{gap:20px}
 .lang{font-size:12.5px}.lang span{padding:6px 12px}.login{font-size:13px;padding:10px 18px}
 .stage{display:grid;grid-template-columns:1fr 1.05fr 1fr;align-items:stretch;gap:22px}
 .col{display:flex;flex-direction:column;gap:var(--gap);justify-content:center;min-height:0}
 .centre{justify-content:center}
 .cuberow{grid-template-columns:1fr;justify-items:center}
 .cuberow .btn{display:none}
 .ctaD{display:grid!important;grid-template-columns:1fr 1fr;gap:12px;width:100%}

 .bear{flex:1;justify-content:center}
 .trio .ph{width:clamp(56px,8dvh,80px);height:clamp(56px,8dvh,80px)}
 .trio .ph.mid{width:clamp(96px,16dvh,150px);height:clamp(96px,16dvh,150px)}
 .who b{font-size:20px}.who span{font-size:14px}
 .gal{flex:1}
 .mos{flex:1;height:auto}
 .dock{width:min(560px,100%);align-self:center}
 .tiles.dsk,.ctaD.dsk{display:grid!important}
 .col>*{order:0!important}
 .ctaD{width:min(440px,100%)}
 .btn{font-size:15px;min-height:62px}
 .logo{width:62px;height:62px}.dj{font-size:36px}.km{font-size:30px}.sub{font-size:13px}
 .tile{min-height:clamp(80px,12dvh,120px)}
}
@media (max-width:380px){.login{padding:7px 10px}.lang span{padding:4px 6px}.km{font-size:17px}.dj{font-size:21px}.logo{width:38px;height:38px}}
@media (max-width:899px) and (max-height:690px){.welcome{display:none}}

/* extra blocks from the President Desk: sit next to / above the bottom bar */
.dockrow{flex:none;display:flex;flex-direction:column;gap:var(--gap)}
.xb{display:none;align-items:center;gap:9px;width:100%;height:clamp(42px,6.2dvh,56px);padding:5px 6px 5px 5px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 6px 14px var(--shadow);text-align:left;overflow:hidden}
.xb.on{display:flex}
#xbL{order:-1}#xbR{display:none!important}
.xb .xi{flex:none;height:100%;aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.xb .xt{flex:1;min-width:0;line-height:1.2}
.xb .xt small{display:block;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--a1)}
.xb .xt b{display:block;font-family:Sora,sans-serif;font-size:clamp(11.5px,1.65dvh,13.5px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xb .xt span{display:block;font-size:clamp(10px,1.4dvh,11.5px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xb .xg{flex:none;padding:6px 11px;border-radius:999px;background:var(--btn);color:#fff;font-weight:700;font-size:11px;box-shadow:0 2px 0 var(--btn-edge)}
.xb .xd{flex:none;display:flex;flex-direction:column;gap:3px;padding-right:2px}.xb .xd i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.35}.xb .xd i.on{opacity:1;background:var(--a1);height:11px;border-radius:3px}
@media (min-width:900px){
 .dockrow{display:grid;grid-template-columns:1fr minmax(0,560px) 1fr;gap:16px;align-items:center}
 .dockrow .dock{width:100%}
 #xbL{order:0;grid-column:1;grid-row:1}#xbR{display:none!important;grid-column:3;grid-row:1}#xbR.on{display:flex!important}
 .dockrow .dock{grid-column:2;grid-row:1}
 .dockrow.one #xbL{grid-column:2;grid-row:1}.dockrow.one .dock{grid-row:2}
}
@media (max-width:899px){
 .hasxb .welcome{display:none}
 .hasxb .phn .tile{min-height:clamp(44px,6.4dvh,70px);padding:4px 3px}
 .hasxb .phn .ti{width:clamp(24px,3.6dvh,34px);height:clamp(24px,3.6dvh,34px)}
 .hasxb .dk{padding:2px}.hasxb .dk i{width:clamp(24px,3.4dvh,30px);height:clamp(24px,3.4dvh,30px)}
}
@media (min-width:900px){
 .xone{--cs:clamp(130px,19dvh,210px)}
 .xone .trio .ph{width:clamp(44px,6.4dvh,72px);height:clamp(44px,6.4dvh,72px)}
 .xone .trio .ph.mid{width:clamp(76px,12dvh,130px);height:clamp(76px,12dvh,130px)}
 .xone .who b{font-size:17px}.xone .who span{font-size:13px}
 .xone .bear{gap:4px}
}
.fml{display:grid;grid-template-columns:1fr;gap:6px}.fmr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:14px}
.fmn{width:24px;height:24px;border-radius:50%;background:var(--f4);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}.fms{margin-left:auto;font-size:12px;color:var(--muted)}
.fmnote{font-size:12.5px!important;color:var(--muted);text-align:center;margin:10px 0 4px}
@media(min-width:600px){.fml{grid-template-columns:1fr 1fr}}
.phn .tile b.two{font-size:clamp(10px,1.4dvh,12px);line-height:1.02}
@media (max-width:899px){.phn .tile{min-height:0;padding:5px 3px;gap:2px}.phn .ti{width:clamp(24px,3.6dvh,34px);height:clamp(24px,3.6dvh,34px);border-radius:10px}.phn .tile b{font-size:clamp(11px,1.55dvh,13px)}}
@media (max-width:899px){
 .bearC{container-type:size;flex:1 1 0;min-height:0}
 .bearC .tagrow,.bearC .who{flex:none}
 .bearC .trio .ph.mid{width:clamp(34px,calc(100cqh - 54px),104px);height:clamp(34px,calc(100cqh - 54px),104px)}
 .bearC .trio .ph{width:clamp(24px,calc((100cqh - 54px)*.58),56px);height:clamp(24px,calc((100cqh - 54px)*.58),56px)}
}
@media (max-width:899px) and (max-height:680px){
 .trio .ph{width:34px;height:34px}.trio .ph.mid{width:58px;height:58px}

 .hasxb .who span{display:none}.hasxb .phn .tile{min-height:0;padding:3px}.hasxb .phn .ti{width:22px;height:22px}
}

/* ---------- demo bar (simulation only, not part of the real site) ---------- */
body.demo{--dm:40px}
body.demo{padding-top:var(--dm)}body.demo .app{height:calc(100dvh - var(--dm))}
