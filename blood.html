<style>
/* Blood Donation page: same Dawn shell as the other inner pages. FINAL and LOCKED (10 Nov 2026). */
:root{
--bg:#FFF4E8;--bg2:#FDE6EF;--bg3:#EFE6FF;--ink:#2A1530;--muted:#6C5470;--glass:rgba(255,255,255,.66);--line:rgba(255,255,255,.95);
--a1:#A3123A;--a2:#FF9F1C;--a3:#8E6CEF;--btn:#A3123A;--btn-edge:#6E0B27;--btn-ink:#fff;--glow:rgba(163,18,58,.25);
--f1:linear-gradient(135deg,#A3123A,#E8590C);--f2:linear-gradient(135deg,#FF9F1C,#FF5E8A);--f3:linear-gradient(135deg,#8E6CEF,#C2185B);--f4:linear-gradient(135deg,#F4B400,#A3123A);
--gold:#B7791F;--wa:#1E9E50;--shadow:rgba(60,20,50,.18);--demo:#1d1024;--demo-ink:#fff;--demo-hi:#ffcf66;
--disp:Sora,"Noto Sans Devanagari",system-ui,sans-serif;--body:Inter,"Noto Sans Devanagari",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.55;color:var(--ink);background:var(--bg);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.3;animation:drift 20s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;left:-25vmax;top:-25vmax;background:var(--a1)}
.b2{width:50vmax;height:50vmax;right:-22vmax;top:30vh;background:var(--a3);animation-delay:-7s}
.b3{width:40vmax;height:40vmax;left:20vw;bottom:-22vmax;background:var(--a2);animation-delay:-13s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.1)}}

.demobar{position:relative;z-index:2;background:var(--demo);color:var(--demo-ink)}
.demobar .in{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding-block:7px;font-size:12px}
.demobar .dl{font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--demo-hi);font-size:10px}
.demobar .grp{display:inline-flex;align-items:center;gap:5px}
.demobar button{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--demo-ink);font-weight:600;font-size:12px}
.demobar button[aria-pressed="true"]{background:var(--demo-hi);color:var(--demo)}

.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:flex;flex-direction:column;gap:14px;padding-block:8px 18px}
.flag{height:4px;border-radius:3px;background:linear-gradient(90deg,#D7263D 0 20%,#F4B400 20% 40%,#fff 40% 60%,#1E9E50 60% 80%,#1F4FBF 80%);box-shadow:0 1px 3px var(--shadow)}

.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.head .l{justify-self:start}.head .r{justify-self:end}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);box-shadow:0 3px 8px var(--shadow);font-weight:700;font-size:11px}
.lang button{padding:5px 8px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);box-shadow:0 2px 0 var(--btn-edge)}
.login{padding:8px 12px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:11px;box-shadow:0 3px 0 var(--btn-edge),0 6px 12px var(--glow);white-space:nowrap}
.login.in{background:var(--wa);box-shadow:0 3px 0 #136b35}
.login:active,.btn:active,.cbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--btn-edge)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 6px 14px var(--shadow),0 0 0 2px var(--glow)}
.names{display:flex;flex-direction:column;line-height:1;white-space:nowrap}
.dj{font-family:var(--disp);font-weight:800;font-size:clamp(21px,6.4vw,32px);letter-spacing:-.8px}
.km{font-family:var(--disp);font-weight:800;font-size:clamp(17px,5.4vw,26px);letter-spacing:-.6px;background:linear-gradient(120deg,var(--a1),var(--a2) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;font-size:12px;color:var(--muted);line-height:1.3;margin-top:-6px}
.sub b{color:var(--ink)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--a1);font-weight:700;letter-spacing:.6px}

.nav{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 6px 16px var(--shadow);overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.nav button[aria-current]{background:var(--btn);color:var(--btn-ink);box-shadow:0 3px 0 var(--btn-edge)}

.title{text-align:center;padding-block:10px 2px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--a1)}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(26px,7vw,40px);letter-spacing:-.8px;margin-top:4px}
h2{font-size:clamp(19px,5vw,24px);color:var(--a1)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cnt{font-size:12px;font-weight:700;color:var(--muted)}

/* person cards */
.pc{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;width:100%;padding:16px 10px 14px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 10px 22px var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s,box-shadow .15s}
.pc:hover{transform:translateY(-3px);box-shadow:0 16px 28px var(--shadow)}
.pc:active{transform:translateY(1px)}
.ph{flex:none;width:84px;height:84px;border-radius:50%;object-fit:cover;background:#fff;border:4px solid #fff;box-shadow:0 8px 18px var(--shadow),0 0 0 3px var(--glow)}
.av{display:flex;align-items:center;justify-content:center;background:var(--f2)}
.av svg{width:56%;height:56%;fill:rgba(255,255,255,.92)}
.pc .nm{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.post{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-size:11.5px;font-weight:700;box-shadow:0 2px 0 var(--btn-edge)}
.post.soft{background:rgba(163,18,58,.1);color:var(--a1);box-shadow:none}
.tap{font-size:11px;color:var(--muted);font-weight:600}

.top{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"p p" "s t";gap:12px}
.top .p{grid-area:p}.top .s{grid-area:s}.top .t{grid-area:t}
.top .p{padding-block:20px 18px;background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,236,214,.75))}
.top .p .ph{width:128px;height:128px;border-width:5px;box-shadow:0 12px 26px var(--shadow),0 0 0 4px rgba(244,180,0,.55)}
.top .p .nm{font-size:20px}
.top .p .post{font-size:13px;padding:4px 14px;background:var(--f4)}
.crown{position:absolute;top:10px;left:50%;transform:translateX(-50%) translateY(-50%);padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.top .ph{width:92px;height:92px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .ph{width:70px;height:70px}
.grid .pc{padding-block:14px 12px}
.grid .nm{font-size:14px}

.pp .ph{width:66px;height:66px;filter:saturate(.85)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:linear-gradient(135deg,#FFE7A3,#F4B400);color:#5a3a00;font-size:10.5px;font-weight:800;letter-spacing:.3px;box-shadow:0 2px 0 rgba(120,80,0,.35)}
.term{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--a1);font-variant-numeric:tabular-nums}
.pp .msg{font-size:12px;color:var(--muted);font-style:italic;line-height:1.35}
.more{align-self:center;padding:10px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:13px;box-shadow:0 4px 0 rgba(163,18,58,.2)}

.cta{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:8px 10px;border-radius:20px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14px;text-align:center;box-shadow:0 5px 0 var(--btn-edge),0 10px 20px var(--glow);transition:transform .08s,box-shadow .08s}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:0 5px 0 rgba(163,18,58,.25),0 10px 20px var(--shadow)}
.foot{text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
.foot b{font-family:var(--disp);color:var(--ink);font-size:14px}

/* details sheet */
.ov{position:fixed;inset:0;z-index:20;background:rgba(20,8,30,.45);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 0}
.sheet{width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--bg);color:var(--ink);border-radius:26px 26px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -16px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sheet .ph{width:150px;height:150px;border-width:5px}
.sheet .nm{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.2}
.sheet .hn{font-size:14px;color:var(--muted);margin-top:-4px}
.sheet .intro{margin:4px 0 0;font-size:14.5px;max-width:42ch}
.ct{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:left}
.crow .ic{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--f1);color:#fff;font-size:16px}
.crow .v{flex:1;min-width:0;overflow-wrap:anywhere}
.crow .v small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.crow .v b{font-variant-numeric:tabular-nums;user-select:all}
.crow.lock{justify-content:center;color:var(--muted);font-size:13.5px;font-weight:600}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:999px;font-weight:700;font-size:14px;color:#fff;background:var(--btn);box-shadow:0 4px 0 var(--btn-edge)}
.cbtn.wa{background:var(--wa);box-shadow:0 4px 0 #136b35}
.close{margin-top:8px;width:100%;padding:12px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:700;box-shadow:0 4px 0 var(--btn-edge)}
.close.alt{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 rgba(163,18,58,.2)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 20px var(--shadow);text-align:center}

@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:760px){
 .page{gap:18px}
 .top{grid-template-columns:1fr 1.25fr 1fr;grid-template-areas:"s p t";align-items:end}
 .top .p .ph{width:150px;height:150px}
 .top .ph{width:110px;height:110px}
 .logo{width:60px;height:60px}.lang{font-size:12.5px}.lang button{padding:6px 12px}.login{font-size:13px;padding:10px 18px}
 .ov{align-items:center}.sheet{border-radius:26px}
}
@media(max-width:480px){.head{gap:6px}.dj{font-size:clamp(19px,5.6vw,24px)}.km{font-size:clamp(15px,4.6vw,20px)}.logo{width:40px;height:40px}.brand{gap:6px}.login{padding:7px 9px;font-size:10.5px}.lang{font-size:10.5px}.lang button{padding:5px 6px}}
@media(max-width:380px){.lang button{padding:4px 5px}.logo{width:36px;height:36px}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}.btn,.pc{transition:none}.pc:hover{transform:none}}

[hidden]{display:none!important}
img{max-width:100%}
/* Blood Donation page: Dawn shell + red activity colour (#C62828). */
:root{--red:#C62828;--red2:#8E0F1F;--redsoft:rgba(198,40,40,.09)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 18px 18px;color:#fff;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#E53935 0%,var(--red) 45%,var(--red2) 100%);box-shadow:0 14px 30px rgba(142,15,31,.35),inset 0 1px 0 rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;gap:8px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:220px;height:220px;left:-80px;top:-90px}.hero::after{width:160px;height:160px;right:-60px;bottom:-70px}
.hero>*{position:relative}
.hero .ey{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18)}
.hero h1{color:#fff;font-size:clamp(28px,8vw,42px)}
.hero p{margin:0;max-width:40ch;font-size:14.5px;opacity:.95}
.drop{width:62px;height:62px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.08)}24%{transform:scale(1)}36%{transform:scale(1.05)}}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:440px;margin-top:6px}
.hb{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:8px;border-radius:18px;font-weight:800;font-size:14px;background:#fff;color:var(--red2);box-shadow:0 5px 0 rgba(0,0,0,.22),0 10px 18px rgba(0,0,0,.18)}
.hb.alt{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.hb:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}

.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.num{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:18px;background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 18px var(--shadow);text-align:center}
.num b{font-family:var(--disp);font-size:clamp(20px,6vw,28px);color:var(--red);font-variant-numeric:tabular-nums;line-height:1.1}
.num span{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.2}
.num.wide{display:none}
.card{padding:16px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 10px 22px var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);display:flex;flex-direction:column;gap:10px}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 .i{flex:none;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--redsoft);font-size:16px}
.card p{margin:0}

.camp{display:flex;gap:12px;align-items:stretch}
.dbox{flex:none;width:78px;border-radius:18px;overflow:hidden;text-align:center;background:#fff;box-shadow:0 6px 14px var(--shadow);display:flex;flex-direction:column}
.dbox .m{background:var(--red);color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;padding:4px 0;text-transform:uppercase}
.dbox .d{font-family:var(--disp);font-size:30px;font-weight:800;line-height:1.1;padding-top:6px;color:var(--ink)}
.dbox .w{font-size:11px;color:var(--muted);font-weight:700;padding-bottom:6px}
.dbox.soon .d{font-size:15px;padding:12px 4px 2px;line-height:1.2}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cinfo b{font-family:var(--disp);font-size:16px}
.row{display:flex;gap:6px;align-items:baseline;font-size:13.5px}.row .k{flex:none;width:1.4em;text-align:center}
.tag{align-self:flex-start;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--red);color:#fff}
.tag.soft{background:var(--redsoft);color:var(--red)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red2),0 10px 20px rgba(198,40,40,.25)}

.emg{border:2px solid rgba(198,40,40,.35);background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,228,228,.8))}
.who{display:flex;align-items:center;gap:10px}
.who .av{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--f1);color:#fff;font-size:20px;box-shadow:0 4px 10px var(--shadow)}
.who b{display:block;font-family:var(--disp)}
.who .pn{font-variant-numeric:tabular-nums;font-weight:700;color:var(--red);user-select:all}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.bgg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bg1{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:#fff;border:1.5px solid rgba(198,40,40,.18);box-shadow:0 4px 0 rgba(198,40,40,.15)}
.bg1 b{font-family:var(--disp);font-size:20px;color:var(--red);line-height:1.1}
.bg1 span{font-size:11px;font-weight:700;color:var(--muted)}
.bg1:active{transform:translateY(3px);box-shadow:none}
.lockn{font-size:12.5px;color:var(--muted);text-align:center}

.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid rgba(198,40,40,.25);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-26px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(198,40,40,.15)}
.tl b{font-family:var(--disp);font-size:15px}
.tl .u{font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}

.mos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mos .t{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:26px;box-shadow:0 4px 10px var(--shadow)}
.mos .t:nth-child(1){background:var(--f1)}.mos .t:nth-child(2){background:var(--f2)}.mos .t:nth-child(3){background:var(--f3)}.mos .t:nth-child(4){background:var(--f4)}
.mos .t.more{background:var(--ink);font-size:12px;font-weight:700;text-align:center;padding:4px}

.ok{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ok li{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:14px;background:#fff;font-size:13px;line-height:1.35;box-shadow:0 3px 8px var(--shadow)}
.ok li i{font-style:normal;font-size:18px;line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bd2{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 70px;padding:10px 6px;border-radius:16px;background:#fff;box-shadow:0 3px 8px var(--shadow);text-align:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.bd2 b{font-size:22px;line-height:1}
.off{text-align:center;align-items:center}
.off .big{font-size:44px}

/* forms inside the sheet */
.frm{align-items:stretch;text-align:left}
.frm h3{font-family:var(--disp);font-size:19px;text-align:center;color:var(--red)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.fld em{font-style:normal;font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-weight:400;font-size:15px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(108,84,112,.3);background:#fff;color:var(--ink);width:100%}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}.ck input{margin-top:3px;width:18px;height:18px;accent-color:var(--red);flex:none}
.err{color:#B00020;font-size:13px;font-weight:700;margin:0;min-height:1em}
.dl2{display:flex;flex-direction:column;gap:8px;width:100%}
.dn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);text-align:left}
.dn .av{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--f2);color:#fff;font-weight:800}
.dn .v{flex:1;min-width:0}.dn .v small{display:block;color:var(--muted);font-size:11.5px}
.dn .mini{flex:none;padding:7px 10px;border-radius:999px;background:var(--wa);color:#fff;font-size:12px;font-weight:700;box-shadow:0 3px 0 #136b35}
.dn .mini.c{background:var(--btn);box-shadow:0 3px 0 var(--btn-edge)}

@media(min-width:760px){
 .nums{grid-template-columns:repeat(4,minmax(0,1fr))}.num.wide{display:flex}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
 .cols>.sec{gap:18px}
 .hero{padding:30px 24px 24px}
}
@media(max-width:380px){.bgg{gap:6px}.bg1 b{font-size:17px}.ok{grid-template-columns:1fr}.hb{font-size:13px}}
@media (prefers-reduced-motion:reduce){.drop{animation:none}}

/* 13 Nov (user): "Become a member" only on the front page; "Back to Home" stays on every page as one wide button */
.cta{grid-template-columns:1fr;width:100%;max-width:440px;margin-inline:auto}

 var emg=sec('🚑','h_emg','<p>'+T('emgs')+'</p><div class="who"><span class="av" aria-hidden="true">☎</span><span><b>'+T('nm')+'</b><span class="note">'+T('helper')+'</span><br><span class="pn">98290 00000</span></span></div><div class="two2"><button type="button" class="cbtn" data-t="t_call">'+T('call')+'</button><button type="button" class="cbtn wa" data-t="t_wa">'+T('wa')+'</button></div><p class="note">'+T('emgn')+'</p>','emg');
 var bgg=sec('🔎','h_bg','<p class="note">'+T('bgs')+'</p><div class="bgg">'+BG.map(function(b,i){return '<button type="button" class="bg1" data-bg="'+i+'"><b>'+b[0]+'</b><span>'+(b[1]===1&&lang==='en'?T('donor1'):T('donors').replace('{n}',b[1]))+'</span></button>'}).join('')+'</div><p class="lockn">'+(mem?T('memnote'):T('lockbg'))+'</p>');
 var about=sec('❤️','h_about','<p>'+T('about1')+'</p><p>'+T('about2')+'</p>');
 /* right column */
 var past=sec('📜','h_past','<ul class="tl">'+CAMPS.map(function(c){return '<li><b>'+T('pc').replace('{y}',c.y)+'</b><br><span class="note">'+T('pcs')+'</span> · <span class="u">'+T('units').replace('{n}',c.u)+'</span></li>'}).join('')+'</ul><p class="note">'+T('pnote')+'</p>');
 var ph=sec('📸','h_ph','<div class="mos"><span class="t">🩸</span><span class="t">🤝</span><span class="t">🏥</span><span class="t">🎖️</span></div><button type="button" class="btn ghost" data-t="t_gal" style="min-height:46px">'+T('phmore')+' ›</button>'+(mem?'':'<p class="note">'+T('phlock')+'</p>'));
 var who=sec('✅','h_who','<ul class="ok"><li><i>🎂</i>'+T('w1')+'</li><li><i>⚖️</i>'+T('w2')+'</li><li><i>💪</i>'+T('w3')+'</li><li><i>⏳</i>'+T('w4')+'</li></ul><p class="note">'+T('wn')+'</p>');
 var rec=sec('🎖️','h_rec','<p>'+T('recs')+'</p><div class="badges"><span class="bd2"><b>🩸</b>'+T('r1')+'</span><span class="bd2"><b>🥉</b>'+T('r2')+'</span><span class="bd2"><b>🥈</b>'+T('r3')+'</span><span class="bd2"><b>🥇</b>'+T('r4')+'</span></div><p class="note">'+T('rnote')+'</p>');
 h+='<div class="cols"><div class="sec">'+next+emg+bgg+about+'</div><div class="sec">'+past+ph+who+rec+'</div></div>';
 m.innerHTML=h;
}
var ov=$('#ov'),sh=$('#sheet'),last=null;
function sheet(h){sh.innerHTML=h+'<button type="button" class="close alt" id="shx">'+T('close')+'</button>';ov.hidden=false;var f=sh.querySelector('input,select,button');if(f)f.focus()}
function hide(){ov.hidden=true;if(last&&last.focus)last.focus()}
function F(k,inner){return '<label class="fld"><span>'+T(k)+'</span>'+inner+'</label>'}
function openAct(a){
 if(a==='reg'){
  if(mem)sheet('<div style="display:flex;flex-direction:column;gap:10px;width:100%;text-align:left"><h3 style="font-family:var(--disp);text-align:center;color:var(--red);margin:0">'+T('f_rh')+'</h3><p class="note">'+T('f_rsm')+'</p>'+F('f_bg','<select id="r_bg">'+opts()+'</select>')+F('f_last','<input type="month" id="r_last">')+'<label class="ck"><input type="checkbox" id="r_a"><span>'+T('f_age')+'</span></label><label class="ck"><input type="checkbox" id="r_b"><span>'+T('f_okm')+'</span></label><p class="err" id="r_e" role="alert"></p><button type="button" class="close" data-send="regm">'+T('send')+'</button></div>');
  else sheet('<div style="display:flex;flex-direction:column;gap:10px;width:100%;text-align:left"><h3 style="font-family:var(--disp);text-align:center;color:var(--red);margin:0">'+T('f_rh')+'</h3><p class="note">'+T('f_rs')+'</p>'+F('f_nm','<input type="text" id="r_nm" maxlength="60">')+F('f_mob','<input type="tel" id="r_mob" inputmode="numeric" maxlength="10" placeholder="9829000000">')+F('f_bg','<select id="r_bg">'+opts()+'</select>')+F('f_last','<input type="month" id="r_last">')+'<label class="ck"><input type="checkbox" id="r_a"><span>'+T('f_age')+'</span></label><label class="ck"><input type="checkbox" id="r_b"><span>'+T('f_okv')+'</span></label><p class="err" id="r_e" role="alert"></p><button type="button" class="close" data-send="regv">'+T('send')+'</button></div>');
 }
 if(a==='need')sheet('<div style="display:flex;flex-direction:column;gap:10px;width:100%;text-align:left"><h3 style="font-family:var(--disp);text-align:center;color:var(--red);margin:0">'+T('f_nh')+'</h3><p class="note">'+T('f_ns')+'</p><div class="two2"><button type="button" class="cbtn" data-t="t_call">'+T('call')+'</button><button type="button" class="cbtn wa" data-t="t_wa">'+T('wa')+'</button></div><div class="two2">'+F('f_pbg','<select id="n_bg">'+opts()+'</select>')+F('f_un','<input type="number" id="n_un" min="1" max="20" value="1">')+'</div>'+F('f_hos','<input type="text" id="n_hos" maxlength="80">')+F('f_by','<input type="date" id="n_by">')+'<p class="err" id="r_e" role="alert"></p><button type="button" class="close" data-send="need" style="background:var(--wa);box-shadow:0 4px 0 #136b35">'+T('f_wa')+'</button></div>');
 if(a==='camp')sheet('<div style="display:flex;flex-direction:column;gap:10px;width:100%;text-align:left"><h3 style="font-family:var(--disp);text-align:center;color:var(--red);margin:0">'+T('f_ch')+'</h3>'+(mem?'':F('f_nm','<input type="text" id="r_nm" maxlength="60">')+F('f_mob','<input type="tel" id="r_mob" inputmode="numeric" maxlength="10" placeholder="9829000000">'))+F('f_bg','<select id="r_bg">'+opts()+'</select>')+F('f_slot','<select id="c_slot"><option>'+T('s1')+'</option><option>'+T('s2')+'</option></select>')+'<p class="err" id="r_e" role="alert"></p><button type="button" class="close" data-send="camp">'+T('send')+'</button></div>');
}
function openBg(i){var b=BG[i];
 if(!mem){sheet('<div class="bg1" style="width:96px"><b>'+b[0]+'</b><span>'+(b[1]===1&&lang==='en'?T('donor1'):T('donors').replace('{n}',b[1]))+'</span></div><p class="intro">'+T('lockbg')+'</p><button type="button" class="close" data-act="need">'+T('need')+'</button>');return}
 var n=Math.min(b[1],5),L='';for(var k=1;k<=n;k++)L+='<div class="dn"><span class="av">'+b[0]+'</span><span class="v"><b>'+esc(T('dn').replace('{n}',k))+'</b><small>'+(k%3?T('can'):T('lastd').replace('{m}',MON[lang][7]+' 2026'))+'</small></span><button type="button" class="mini c" data-t="t_call">📞</button><button type="button" class="mini" data-t="t_wa">💬</button></div>';
 sheet('<h3 style="font-family:var(--disp);color:var(--red);margin:0">'+T('bgh').replace('{g}',b[0])+'</h3><div class="dl2">'+L+'</div><p class="note">'+T('memnote')+'</p>');
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function chk(id){var e=document.getElementById(id);return e&&e.checked}
function send(k){var e=$('#r_e');
 if(k==='regv'){if(!val('r_nm')||val('r_mob').replace(/\D/g,'').length!==10||!val('r_bg')){e.textContent=T('e_fill');return}if(!chk('r_a')||!chk('r_b')){e.textContent=T('e_tick');return}hide();toast(T('ok_v'))}
 if(k==='regm'){if(!val('r_bg')){e.textContent=T('e_bg');return}if(!chk('r_a')||!chk('r_b')){e.textContent=T('e_tick');return}hide();toast(T('ok_m'))}
 if(k==='need'){if(!val('n_bg')){e.textContent=T('e_bg');return}hide();toast(T('ok_n'))}
 if(k==='camp'){if((!mem&&(!val('r_nm')||val('r_mob').replace(/\D/g,'').length!==10))||!val('r_bg')){e.textContent=T('e_fill');return}hide();toast(T('ok_c'))}
}
document.addEventListener('click',function(e){
 var t;
 if(e.target.closest('#shx')||e.target===ov)return hide();
 if(t=e.target.closest('[data-send]'))return send(t.dataset.send);
 if(t=e.target.closest('[data-act]')){last=t;return openAct(t.dataset.act)}
 if(t=e.target.closest('[data-bg]')){last=t;return openBg(+t.dataset.bg)}
 if(t=e.target.closest('[data-t]'))toast(T(t.dataset.t));
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!ov.hidden)hide()});
var tt;function toast(s){var t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2800)}
$('#loginb').addEventListener('click',function(){if(!mem)toast(T('t_login'))});
$('#navb').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
$('#l_hi').addEventListener('click',function(){lang='hi';render()});
$('#l_en').addEventListener('click',function(){lang='en';render()});
$('#d_vis').addEventListener('click',function(){mem=false;render()});
$('#d_mem').addEventListener('click',function(){mem=true;render()});
$('#d_on').addEventListener('click',function(){on=!on;render()});
$('#d_cnt').addEventListener('click',function(){cnt=!cnt;render()});
$('#d_dt0').addEventListener('click',function(){dated=false;render()});
$('#d_dt1').addEventListener('click',function(){dated=true;render()});
render();
})();
</script>
<script>
/* Demo links between the new-look pages. They work on the GitHub demo (github.io) and the real site; inside Claude each page keeps its own note. */
(function(){
var h=location.hostname;
if(!(location.protocol==='file:'||/github\.io$|netlify\.app$|djsgkotamain\.in$|^localhost$|^127\.0\.0\.1$/.test(h)))return;
var M={m_home:'index.html',b_home:'index.html',m_cel:'birthdays.html',m_about:'about.html',m_bear:'bearers.html',m_ev:'events.html',m_gal:'gallery.html',m_dir:'directory.html',m_biz:'business.html',m_blood:'blood.html',m_join:'join.html',b_join:'join.html'};
var here=location.pathname.split('/').pop()||'index.html';
document.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('button,a');if(!b)return;
 var k=b.getAttribute('data-i');if(!M[k]){var c=b.querySelector('[data-i]');k=c&&c.getAttribute('data-i')}
 var u=M[k];if(!u||u===here)return;
 e.stopPropagation();e.preventDefault();location.href=u;
},true);
})();
</script>
