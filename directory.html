<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DJSG Directory</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{
--bg:#FFF4E8;--bg2:#FDE6EF;--bg3:#EFE6FF;--ink:#2A1530;--muted:#6C5470;--glass:rgba(255,255,255,.66);--line:rgba(255,255,255,.95);
--a1:#A3123A;--a2:#FF9F1C;--a3:#8E6CEF;--btn:#A3123A;--btn-edge:#6E0B27;--btn-ink:#fff;--glow:rgba(163,18,58,.25);
--f1:linear-gradient(135deg,#A3123A,#E8590C);--f2:linear-gradient(135deg,#FF9F1C,#FF5E8A);--f3:linear-gradient(135deg,#8E6CEF,#C2185B);--f4:linear-gradient(135deg,#F4B400,#A3123A);
--gold:#B7791F;--gold2:#E9C46A;--paper:#FFFBF2;--wa:#1E9E50;--shadow:rgba(60,20,50,.18);--demo:#1d1024;--demo-hi:#ffcf66;
--disp:Sora,"Noto Sans Devanagari",system-ui,sans-serif;--body:Inter,"Noto Sans Devanagari",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.3;animation:drift 20s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;left:-25vmax;top:-25vmax;background:var(--a1)}
.b2{width:50vmax;height:50vmax;right:-22vmax;top:30vh;background:var(--a3);animation-delay:-7s}
.b3{width:40vmax;height:40vmax;left:20vw;bottom:-22vmax;background:var(--a2);animation-delay:-13s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.1)}}

/* demo bar */
.demobar{position:relative;z-index:3;background:var(--demo);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.demobar .in{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding-block:7px;font-size:12px}
.demobar .dl{font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--demo-hi);font-size:10px}
.demobar .grp{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.demobar button{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:12px}
.demobar button[aria-pressed="true"]{background:var(--demo-hi);color:var(--demo)}
.demobar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.demobar input{accent-color:var(--demo-hi);width:16px;height:16px}

.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.page{display:flex;flex-direction:column;gap:12px;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px))}
.flag{height:4px;border-radius:3px;background:linear-gradient(90deg,#D7263D 0 20%,#F4B400 20% 40%,#fff 40% 60%,#1E9E50 60% 80%,#1F4FBF 80%);box-shadow:0 1px 3px var(--shadow)}

/* header (same as other Dawn pages) */
.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.head .l{justify-self:start}.head .r{justify-self:end}
.lang{display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);box-shadow:0 3px 8px var(--shadow);font-weight:700;font-size:11px}
.lang button{padding:5px 8px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--btn);color:#fff;box-shadow:0 2px 0 var(--btn-edge)}
.login{padding:8px 12px;border-radius:999px;background:var(--btn);color:#fff;font-weight:700;font-size:11px;box-shadow:0 3px 0 var(--btn-edge),0 6px 12px var(--glow);white-space:nowrap}
.login.in{background:var(--wa);box-shadow:0 3px 0 #136b35}
.login:active,.btn:active,.cb:active{transform:translateY(3px);box-shadow:none}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 6px 14px var(--shadow),0 0 0 2px var(--glow)}
.names{display:flex;flex-direction:column;line-height:1;white-space:nowrap}
.dj{font-family:var(--disp);font-weight:800;font-size:clamp(21px,6.4vw,32px);letter-spacing:-.8px}
.km{font-family:var(--disp);font-weight:800;font-size:clamp(17px,5.4vw,26px);letter-spacing:-.6px;background:linear-gradient(120deg,var(--a1),var(--a2) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;font-size:12px;color:var(--muted);line-height:1.3;margin-top:-6px}
.sub b{color:var(--ink)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--a1);font-weight:700;letter-spacing:.6px}
.nav{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 6px 16px var(--shadow);overflow-x:auto;scrollbar-width:none;justify-content:safe center}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.nav button[aria-current]{background:var(--btn);color:#fff;box-shadow:0 3px 0 var(--btn-edge)}

.title{text-align:center;padding-top:4px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--a1)}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(24px,6.6vw,38px);letter-spacing:-.8px;margin-top:2px}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* toolbar */
.tools{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:18px;background:var(--glass);border:1px solid var(--line);box-shadow:0 6px 16px var(--shadow)}
.seg button{padding:9px 4px;border-radius:14px;font-weight:700;font-size:13px;color:var(--muted);line-height:1.15}
.seg button small{display:block;font-weight:500;font-size:10.5px;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--btn);color:#fff;box-shadow:0 3px 0 var(--btn-edge)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.srch{position:relative;flex:1 1 220px;min-width:0}
.srch input{width:100%;padding:11px 14px 11px 38px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.85);box-shadow:inset 0 2px 4px var(--shadow);font-size:14px}
.srch .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6}
.res{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;background:#fff;border-radius:16px;box-shadow:0 14px 30px var(--shadow);overflow:hidden}
.res button{display:flex;justify-content:space-between;gap:8px;width:100%;padding:10px 14px;text-align:left;border-bottom:1px solid #f2e6ea;font-size:14px}
.res button span{color:var(--muted);font-size:12px;white-space:nowrap}
.res .none{padding:10px 14px;color:var(--muted);font-size:13px}
.chipb{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:13px;box-shadow:0 4px 0 rgba(163,18,58,.2);white-space:nowrap;color:var(--ink);text-decoration:none}
.chipb.pr{background:var(--f4);color:#fff;border-color:transparent;box-shadow:0 4px 0 var(--btn-edge)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* lock screens */
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 18px;border-radius:26px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 14px 30px var(--shadow)}
.lock .big{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--f4);box-shadow:0 8px 0 var(--btn-edge),0 16px 30px var(--glow)}
.lock h2{font-size:22px;color:var(--a1)}
.lock p{margin:0;max-width:40ch;color:var(--muted)}
.lock ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 22px;border-radius:20px;background:var(--btn);color:#fff;font-weight:700;font-size:14.5px;box-shadow:0 5px 0 var(--btn-edge),0 10px 20px var(--glow)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:0 5px 0 rgba(163,18,58,.25)}
.bar{width:min(280px,100%);height:10px;border-radius:6px;background:rgba(163,18,58,.12);overflow:hidden}
.bar i{display:block;height:100%;width:60%;background:var(--f1);border-radius:6px}

/* ===== BOOK ===== */
.book{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.spread{display:grid;grid-template-columns:1fr;gap:0;perspective:1600px}
.pg{position:relative;min-height:560px;padding:20px 18px 46px;background:
 radial-gradient(circle at 20% 15%,rgba(233,196,106,.10),transparent 40%),radial-gradient(circle at 85% 90%,rgba(163,18,58,.06),transparent 45%),var(--paper);
 border-radius:10px;box-shadow:0 14px 30px var(--shadow),inset 0 0 0 7px var(--paper),inset 0 0 0 9px var(--gold),inset 0 0 0 12px var(--paper),inset 0 0 0 13px var(--a1);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pg .cn{position:absolute;width:22px;height:22px;color:var(--gold);font-size:18px;line-height:22px;text-align:center}
.cn.tl{left:12px;top:10px}.cn.tr{right:12px;top:10px}.cn.bl{left:12px;bottom:10px}.cn.br{right:12px;bottom:10px}
.pgh{display:flex;align-items:center;justify-content:center;gap:7px;padding:2px 22px 6px;border-bottom:1px solid rgba(183,121,31,.45);font-size:11px;color:var(--muted)}
.pgh img{width:22px;height:22px;border-radius:50%}
.pgh b{font-family:var(--disp);font-weight:800;color:var(--a1);font-size:13px}
.pgf{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--muted)}
.pgf .no{font-family:var(--disp);font-weight:700;color:var(--gold);font-size:13px;letter-spacing:2px}
.turnN{animation:tN .45s ease}.turnB{animation:tB .45s ease}
@keyframes tN{from{transform:rotateY(-70deg);transform-origin:left center;opacity:.2}to{transform:none;transform-origin:left center}}
@keyframes tB{from{transform:rotateY(70deg);transform-origin:right center;opacity:.2}to{transform:none;transform-origin:right center}}
.bnav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:10px}
.bnav .pn{text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.cb{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:999px;background:var(--btn);color:#fff;font-weight:700;font-size:14px;box-shadow:0 4px 0 var(--btn-edge)}
.cb[disabled]{opacity:.35;pointer-events:none}
.cb.wa{background:var(--wa);box-shadow:0 4px 0 #136b35}
.cb.sm{padding:7px 12px;font-size:12.5px}
.cb.alt{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 rgba(163,18,58,.2)}

/* cover */
.pg.cover{background:radial-gradient(circle at 50% 30%,#C2185B 0,#7a0f2d 55%,#3d0718 100%);color:#fff;align-items:center;justify-content:center;text-align:center;box-shadow:0 14px 30px var(--shadow),inset 0 0 0 8px #5a0b22,inset 0 0 0 10px var(--gold2),inset 0 0 0 14px #5a0b22,inset 0 0 0 15px var(--gold2)}
.cover .cn{color:var(--gold2)}
.cover .clogo{width:120px;height:120px;border-radius:50%;border:4px solid var(--gold2);box-shadow:0 0 0 6px rgba(233,196,106,.25),0 14px 30px rgba(0,0,0,.4)}
.cover .g{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;opacity:.9;margin-top:12px}
.cover .k{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1;color:var(--gold2);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.cover .t{font-family:var(--disp);font-weight:700;font-size:22px;margin-top:10px}
.cover .s{display:inline-block;margin-top:6px;padding:3px 14px;border-radius:999px;border:1px solid var(--gold2);color:var(--gold2);font-weight:700;letter-spacing:1px;font-size:13px}
.cover .orn{color:var(--gold2);letter-spacing:6px;margin:6px 0}
.cover .w{font-size:11.5px;opacity:.85;margin-top:14px}

/* bearers page */
.bp{align-items:center;text-align:center}
.bp .blogo{width:84px;height:84px;border-radius:50%;border:3px solid var(--gold2);box-shadow:0 8px 18px var(--shadow)}
.bp .bk{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1;color:var(--a1)}
.bp .bs{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.bper{display:flex;flex-direction:column;align-items:center;gap:3px}
.bper .ph{width:84px;height:84px}
.bper.pres .ph{width:128px;height:128px;box-shadow:0 10px 22px var(--shadow),0 0 0 4px rgba(244,180,0,.6)}
.bper b{font-family:var(--disp);font-size:15px;line-height:1.2}
.bper.pres b{font-size:18px}
.btwo{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

/* contents */
.toc .lt button.on{background:var(--a1);color:#fff}
.toc .tg{display:flex;flex-direction:column;gap:2px}.toc .tsel{font-size:11.5px;color:var(--muted);text-align:center;margin:4px 0 2px}
.toc{display:flex;flex-direction:column;gap:2px}
.toc h3{font-family:var(--disp);font-size:20px;color:var(--a1);text-align:center;margin-bottom:4px}
.toc .lt{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:6px}
.toc .lt button{width:28px;height:28px;border-radius:8px;background:rgba(163,18,58,.08);font-weight:800;font-size:12.5px;color:var(--a1)}
.toc .lt button[disabled]{opacity:.3}
.toc .gL{font-family:var(--disp);font-weight:800;color:var(--gold);font-size:13px;margin-top:4px}
.toc .en{display:flex;align-items:baseline;gap:6px;width:100%;padding:3px 0;text-align:left;font-size:13.5px}
.toc .en i{flex:1;border-bottom:2px dotted rgba(183,121,31,.5);transform:translateY(-3px)}
.toc .en b{font-family:var(--disp);color:var(--a1);font-variant-numeric:tabular-nums}

/* photos */
.ph{flex:none;border-radius:50%;object-fit:cover;background:#fff;border:3px solid #fff;box-shadow:0 6px 14px var(--shadow)}
.av{display:flex;align-items:center;justify-content:center}
.av svg{width:58%;height:58%;fill:rgba(255,255,255,.92)}
.av.h{background:var(--f1)}.av.w{background:var(--f2)}
.sq{border-radius:14px}
.famph{position:relative;width:100%;height:150px;border-radius:14px;background:var(--f3);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 8px 18px var(--shadow);overflow:hidden}
.famph svg{width:120px;height:80px;fill:rgba(255,255,255,.9)}
.famph small,.duo small{position:absolute;left:8px;bottom:6px;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;font-size:10.5px;font-weight:700}

/* family details */
.fam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.duo{display:flex;flex-direction:column;gap:8px;align-items:center}
.duo figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:700;text-align:center}
.duo .ph{width:92px;height:92px;border-radius:16px}
.nm{font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.nm2{font-weight:600;font-size:14.5px;margin-top:2px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;line-height:1.5;white-space:nowrap}
.tg.post{background:var(--btn);color:#fff}
.tg.pp{background:linear-gradient(135deg,#FFE7A3,#F4B400);color:#5a3a00;box-shadow:0 2px 0 rgba(120,80,0,.35)}
.tg.fd{background:#2A1530;color:#FFD58A}
.tg.since{background:rgba(163,18,58,.09);color:var(--a1)}
.tg.ok{background:#E3F6EA;color:#136b35}
.tg.off{background:#EEE9F0;color:var(--muted)}
.dl{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:13.5px}
.dl>div{display:grid;grid-template-columns:22px 1fr;gap:4px;align-items:start}
.dl .k{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:block}
.kids{margin:0;padding:0;list-style:none}
.kids li{font-size:13px}
.kids em{font-style:normal;font-size:11px;color:var(--muted)}
.pbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* compact */
.minis{display:flex;flex-direction:column;gap:10px;flex:1}
.mini{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid rgba(183,121,31,.35);text-align:left;width:100%}
.mini .nm{font-size:15.5px}.mini .nm2{font-size:13px}
.mini .dl{font-size:12.5px;gap:3px;margin-top:5px}
.mph{display:grid;grid-template-columns:62px;gap:5px}
.mph .ph{width:62px;height:62px;border-radius:12px;border-width:2px}
.mph .fs{width:62px;height:44px;border-radius:10px;background:var(--f3);border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px var(--shadow)}
.mph .fs svg{width:40px;height:28px;fill:rgba(255,255,255,.9)}

/* list */
.list{display:grid;grid-template-columns:1fr;gap:10px}
.lc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:14px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 10px 22px var(--shadow);text-align:left;width:100%}
.lc .duo .ph{width:72px;height:72px;border-radius:14px}
.lc .nm{font-size:16.5px}
.empty{text-align:center;color:var(--muted);padding:20px}

/* sheet */
.ov{position:fixed;inset:0;z-index:20;background:rgba(20,8,30,.45);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{width:min(560px,100%);max-height:90dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -16px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
.sheet h2{font-size:21px;color:var(--a1)}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.ptabs button{padding:7px 4px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--muted)}
.ptabs button[aria-pressed="true"]{background:var(--btn);color:#fff}
.bigph{align-self:center;width:200px;height:200px;border-radius:24px}
.bigfam{height:200px}
.close{width:100%;padding:12px;border-radius:999px;background:var(--btn);color:#fff;font-weight:700;box-shadow:0 4px 0 var(--btn-edge)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt h3{font-size:14px;font-family:var(--body);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.optg{display:flex;flex-wrap:wrap;gap:6px}
.optg label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13.5px;font-weight:600;cursor:pointer}
.optg label.dis{opacity:.5;cursor:not-allowed}
.optg input{accent-color:var(--a1)}
.warn{padding:10px 12px;border-radius:14px;background:#FFF0D6;color:#6b4300;font-size:13px}
.okbox{padding:12px;border-radius:14px;background:#E3F6EA;color:#0f5a2b;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 20px var(--shadow);text-align:center}
.foot{text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
.foot b{font-family:var(--disp);color:var(--ink);font-size:14px}
.membernote{text-align:center;font-size:12px;font-weight:700;color:var(--a1)}

@media(min-width:620px){.list{grid-template-columns:1fr 1fr}}
@media(min-width:760px){.logo{width:60px;height:60px}.lang{font-size:12.5px}.lang button{padding:6px 12px}.login{font-size:13px;padding:10px 18px}.ov{align-items:center}.sheet{border-radius:26px}.tools{flex-direction:row;align-items:center}.seg{flex:0 0 420px}}
@media(min-width:900px){
 .spread.two{grid-template-columns:1fr 1fr}
 .spread.two .pg:first-child{border-radius:10px 2px 2px 10px}
 .spread.two .pg:last-child{border-radius:2px 10px 10px 2px}
 .spread.one{max-width:540px;margin:0 auto;width:100%}
 .pg{min-height:640px}
 .list{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:480px){.head{gap:6px}.dj{font-size:clamp(19px,5.6vw,24px)}.km{font-size:clamp(15px,4.6vw,20px)}.logo{width:40px;height:40px}.brand{gap:6px}.login{padding:7px 9px;font-size:10.5px}.lang{font-size:10.5px}.lang button{padding:5px 6px}}
@media(max-width:380px){.lang button{padding:4px 5px}.logo{width:36px;height:36px}.duo .ph{width:78px;height:78px}.pg{padding-inline:15px}.cover .k{font-size:38px}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}.turnN,.turnB{animation:none}}

 r.innerHTML=f.length?f.map(function(m){return '<button type="button" data-jp="'+pageOf(m.id,a)+'">'+nmH(m)+'<span>'+t('b_'+m.b)+' · '+t('page')+' '+pageOf(m.id,a)+'</span></button>'}).join(''):'<div class="none">'+t('noRes')+'</div>';r.hidden=false}

/* sheets */
var ov=$('#ov'),sh=$('#sheet');
function open(h){sh.innerHTML=h+'<button type="button" class="close" id="cls">'+t('close')+'</button>';ov.hidden=false;$('#cls').focus()}
function close(){ov.hidden=true}
function detail(id,tab){var m=M.filter(function(x){return x.id===id})[0];tab=tab||'m';
 var big=tab==='m'?ph(m,'h','bigph'):tab==='s'?ph(m,'w','bigph'):'<div class="famph bigfam">'+FAM+'<small>'+t('family')+'</small></div>';
 open('<div class="ptabs" role="group">'+[['m','ph_m'],['s','ph_s'],['f','ph_f']].map(function(x){return '<button type="button" data-tab="'+x[0]+'" data-id="'+m.id+'" aria-pressed="'+(tab===x[0])+'">'+t(x[1])+'</button>'}).join('')+'</div>'+big+'<div><h2>'+nmH(m)+'</h2><div class="nm2">& '+nmW(m)+'</div>'+tags(m)+details(m,true)+'</div><p class="membernote">'+t('foot_note')+'</p>')}
function exportS(){open('<h2>🖨 '+t('ex_t')+'</h2><p class="note">'+t('ex_s')+'</p>'+
 '<div class="opt"><h3>'+t('ex_fmt')+'</h3><div class="optg"><label><input type="radio" name="fm" checked> PDF</label><label><input type="radio" name="fm"> Word (.docx)</label><label><input type="radio" name="fm"> Excel (.xlsx)</label></div></div>'+
 '<div class="opt"><h3>'+t('ex_lay')+'</h3><div class="optg"><label><input type="radio" name="ly" checked> '+t('ex_l1')+'</label><label><input type="radio" name="ly"> '+t('ex_l2')+'</label></div></div>'+
 '<div class="opt"><h3>'+t('ex_inc')+'</h3><div class="optg">'+['ex_ph','biz','kids','phone','ann'].map(function(k){return '<label><input type="checkbox" checked> '+t(k)+'</label>'}).join('')+'<label><input type="checkbox"> '+t('ex_dob')+'</label></div></div>'+
 '<div class="opt"><h3>'+t('ex_ord')+'</h3><div class="optg"><label><input type="radio" name="or" checked> '+t('ex_az')+'</label><label><input type="radio" name="or"> '+t('ex_bz')+'</label></div></div>'+
 '<div class="warn">🔒 '+t('ex_never')+'<br>'+t('ex_line')+'</div><div id="exr"></div><button type="button" class="btn" id="exgo">'+t('ex_go')+'</button>')}

var tt;function toast(k){var e=$('#toast');e.textContent=t(k);e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2600)}

document.addEventListener('click',function(e){var g;
 if((g=e.target.closest('[data-role]'))){ROLE=g.dataset.role;close();draw();return}
 if((g=e.target.closest('[data-view]'))){VIEW=g.dataset.view;try{localStorage.setItem('djsg_dirview',VIEW)}catch(_){}var a=pages();PI=Math.min(PI,a.length-1);draw();return}
 if((g=e.target.closest('[data-jp]'))){Q='';close();jump(+g.dataset.jp);return}
 if((g=e.target.closest('[data-jl]'))){var a2=pages(),m=M.filter(function(x){return x.l===g.dataset.jl})[0];if(m)jump(pageOf(m.id,a2));return}
 if((g=e.target.closest('[data-bz]'))){BIZ=g.dataset.bz;draw();return}
 if((g=e.target.closest('[data-tab]'))){detail(g.dataset.id,g.dataset.tab);return}
 if((g=e.target.closest('[data-t]'))){e.stopPropagation();toast(g.dataset.t);return}
 if((g=e.target.closest('[data-det]'))){detail(g.dataset.det);return}
 if((g=e.target.closest('[data-nav]'))){toast('t_nav');return}
 if(e.target.closest('#bk')){go(-1);return}
 if(e.target.closest('#nx')){go(1);return}
 if(e.target.closest('#exb')){exportS();return}
 if(e.target.closest('#exgo')){$('#exr').innerHTML='<div class="okbox">✔ '+t('ex_done')+'</div>';return}
 if(e.target.closest('#approve')){ROLE='mem';draw();return}
 if(e.target.closest('#cls')||e.target===ov){close();return}
 if(e.target.closest('#loginb')){toast('t_login');return}
 if(!e.target.closest('.srch')){var r=$('#res');if(r)r.hidden=true}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){Q=e.target.value;if(VIEW==='list'){var pos=e.target.selectionStart;draw();var q=$('#q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}else results()}});
document.addEventListener('focusin',function(e){if(e.target.id==='q')results()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){close();return}if(e.target.tagName==='INPUT')return;if(!ov.hidden)return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
$('#l_hi').onclick=function(){LANG='hi';try{localStorage.setItem('djsg_lang','hi')}catch(_){}draw()};
$('#l_en').onclick=function(){LANG='en';try{localStorage.setItem('djsg_lang','en')}catch(_){}draw()};
$('#d_hideall').onchange=function(){HIDEALL=this.checked;draw()};
$('#d_hideone').onchange=function(){HIDEONE=this.checked;draw()};
wide.addEventListener&&wide.addEventListener('change',function(){draw()});
draw();
})();
</script>
<script>
/* Demo links between the new-look pages. They work on the GitHub demo (github.io) and the real site; inside Claude each page keeps its own note. */
(function(){
var h=location.hostname;
if(!(location.protocol==='file:'||/github\.io$|netlify\.app$|djsgkotamain\.in$|^localhost$|^127\.0\.0\.1$/.test(h)))return;
var M={m_home:'index.html',b_home:'index.html',m_cel:'birthdays.html',m_about:'about.html',m_bear:'bearers.html',m_ev:'events.html',m_gal:'gallery.html',m_dir:'directory.html',m_biz:'business.html',m_blood:'blood.html',m_join:'join.html',b_join:'join.html'};
var here=location.pathname.split('/').pop()||'index.html';
document.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('button,a');if(!b)return;
 var k=b.getAttribute('data-i');if(!M[k]){var c=b.querySelector('[data-i]');k=c&&c.getAttribute('data-i')}
 var u=M[k];if(!u||u===here)return;
 e.stopPropagation();e.preventDefault();location.href=u;
},true);
})();
</script>

window.scrollTo(0,0);h.classList.add('ready')})();</script>
