/* Layout: same Dawn shell as the front page (flag, header, pill menu), then one centred reading column:

:root{
--bg:#FFF4E8;--bg2:#FDE6EF;--bg3:#EFE6FF;--ink:#2A1530;--muted:#6C5470;--glass:rgba(255,255,255,.66);--line:rgba(255,255,255,.95);

*{box-sizing:border-box}
